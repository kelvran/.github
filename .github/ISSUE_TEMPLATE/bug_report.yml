name: Bug Report
description: Report a problem with a Kelvran repo
labels: ["bug"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repo
      options:
        - gateway
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: false
