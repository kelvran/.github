name: Feature Request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repo
      options:
        - gateway
        - evals (not yet public)
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
